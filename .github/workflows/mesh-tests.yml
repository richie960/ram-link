name: RAMLink mesh tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check agent CLI help
        run: python -m ramlink_mesh.agent --help
      - name: Check dashboard CLI help
        run: python -m ramlink_mesh.dashboard --help
